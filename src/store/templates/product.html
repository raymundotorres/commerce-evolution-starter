{% extends "base.html" %}
{% block title %}{{ product.name }} · {{ config.STORE_NAME }}{% endblock %}
{% block content %}
<section class="product-detail">
  <div class="product-image"><img src="{{ product.image_url }}" alt="{{ product.name }}"></div>
  <div>
    <p class="eyebrow">{{ product.sku }}</p>
    <h1>{{ product.name }}</h1>
    <p class="lead">{{ product.description }}</p>
    <p class="stock">{{ product.stock_quantity }} available</p>
    <div class="detail-buy"><strong>{{ product.price_cents|money }}</strong>
      <form method="post" action="{{ url_for('cart.add', product_id=product.id) }}"><button>Add to cart</button></form>
    </div>
  </div>
</section>
{% endblock %}
