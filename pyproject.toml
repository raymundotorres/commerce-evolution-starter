[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-evolution-starter"
version = "0.1.0"
description = "ITESO Software Design final project baseline: a small e-commerce system designed to evolve."
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
store = ["templates/*.html", "static/css/*.css", "static/images/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
